html, body {

.canvas {

}
.logo {

}
.title-wrap {

  align-items: center;
  justify-content: center;
  z-index: 2;
}
h1 {

  font-weight: 900;

  letter-spacing: -0.3px;
}
.art-wrap {
  display: flex;
  align-items: flex-end;
  justify-content: center;
  width: 100%;
  flex-grow: 1;
  overflow: hidden;
}
.art-wrap svg {

}
</style>
