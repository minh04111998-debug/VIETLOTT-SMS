<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 1200px;
  height: 675px;
  overflow: hidden;
  background: #F6EED9;
  font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Tahoma, sans-serif;
  -webkit-font-smoothing: antialiased;
}
.canvas {
  width: 1200px;
  height: 675px;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  padding: 26px 48px 0 48px;
  background:
    radial-gradient(circle at 20% 22%, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0) 48%),
    radial-gradient(circle at 82% 76%, rgba(226,208,170,0.38) 0%, rgba(226,208,170,0) 52%),
    linear-gradient(180deg, #F8F0DC 0%, #F4E9CE 100%);
}
.topbar {
  width: 100%;
  display: flex;
  justify-content: flex-end;
  align-items: center;
}
.logo {
  font-size: 27px;
  font-weight: 900;
  color: #141414;
  letter-spacing: -0.6px;
  line-height: 1;
}
.title-wrap {
  width: 100%;
  max-width: 1060px;
  text-align: center;
  margin-top: 8px;
  min-height: 118px;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 2;
}
h1 {
  color: #004AAD;
  font-size: 48px;
  font-weight: 900;
  line-height: 1.24;
  letter-spacing: -0.3px;
}
.art-wrap {
  display: flex;
  align-items: flex-end;
  justify-content: center;
  width: 100%;
  flex-grow: 1;
  overflow: hidden;
}
.art-wrap svg {
  width: 620px;
  height: 430px;
}
</style>
</head>
