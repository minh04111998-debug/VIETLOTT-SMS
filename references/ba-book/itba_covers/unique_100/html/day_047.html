<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  width: 1200px;
  height: 675px;
  overflow: hidden;
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: #0f172a;
}
.card {
  width: 1200px;
  height: 675px;
  position: relative;
  background: radial-gradient(circle at 20% 25%, #27272a 0%, #18181b 100%);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 34px 48px 24px 48px;
  color: #f8fafc;
}
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.badge {
  background: rgba(74, 222, 128, 0.15);
  border: 1.5px solid #4ade80;
  color: #4ade80;
  padding: 6px 16px;
  border-radius: 999px;
  font-weight: 800;
  font-size: 13px;
  letter-spacing: 0.6px;
}
.logo {
  font-size: 24px;
  font-weight: 900;
  color: #94a3b8;
  letter-spacing: -0.5px;
}
.logo span { color: #ffffff; }
.title-area {
  text-align: center;
  margin-top: 6px;
  min-height: 105px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.headline {
  font-size: 40px;
  font-weight: 900;
  color: #4ade80;
  line-height: 1.25;
  margin-bottom: 6px;
}
.subheadline {
  font-size: 21px;
  font-weight: 600;
  color: #e4e4e7;
  max-width: 950px;
  margin: 0 auto;
  line-height: 1.35;
}
.graphic-area {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
}
.footer {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  color: #64748b;
  font-weight: 600;
  border-top: 1px solid rgba(255,255,255,0.08);
  padding-top: 10px;
}
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <div class="badge">TECH FOR BA · GIT & DEV</div>
    <div class="logo">iTBA <span>Mentor</span></div>
  </div>
  <div class="title-area">
    <div class="headline">Branch, Merge, Pull Request, Tag...</div>
    <div class="subheadline">Giải thích Git để BA không ngồi họp như người ngoài hành tinh</div>
  </div>
  <div class="graphic-area">
    
    <svg width="640" height="260" viewBox="0 0 640 260">
      <!-- Main Branch Line -->
      <line x1="50" y1="180" x2="590" y2="180" stroke="#38bdf8" stroke-width="4"/>
      <circle cx="90" cy="180" r="14" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
      <circle cx="210" cy="180" r="14" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
      <circle cx="390" cy="180" r="14" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
      <circle cx="530" cy="180" r="16" fill="#10b981" stroke="#34d399" stroke-width="3.5"/>
      <text x="50" y="215" fill="#38bdf8" font-size="13" font-weight="bold">main (prod)</text>
      
      <!-- Feature Branch Curve -->
      <path d="M 210,180 C 260,180 260,80 310,80 L 430,80 C 470,80 480,180 530,180" fill="none" stroke="#f59e0b" stroke-width="3.5" stroke-dasharray="6,4"/>
      <circle cx="330" cy="80" r="14" fill="#0f172a" stroke="#f59e0b" stroke-width="3"/>
      <circle cx="430" cy="80" r="14" fill="#0f172a" stroke="#f59e0b" stroke-width="3"/>
      <text x="380" y="55" fill="#fbbf24" font-size="13" font-weight="bold">feature/cart-checkout</text>
      
      <!-- PR Badge -->
      <rect x="460" y="105" width="110" height="32" rx="8" fill="#10b981" stroke="#064e3b" stroke-width="1.5"/>
      <text x="515" y="126" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">✓ PR Merged</text>
    </svg>
    
  </div>
  <div class="footer">
    <div>Day 47/100 · Sách 100 ngày làm BA</div>
    <div>Nguyễn Bá Phú — ITBA Mentor</div>
  </div>
</div>
</body>
</html>
