<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  width: 1200px;
  height: 675px;
  overflow: hidden;
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: #0f172a;
}
.card {
  width: 1200px;
  height: 675px;
  position: relative;
  background: radial-gradient(circle at 20% 20%, #312e81 0%, #1e1b4b 100%);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 34px 48px 24px 48px;
  color: #f8fafc;
}
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.badge {
  background: rgba(245, 158, 11, 0.15);
  border: 1.5px solid #f59e0b;
  color: #f59e0b;
  padding: 6px 16px;
  border-radius: 999px;
  font-weight: 800;
  font-size: 13px;
  letter-spacing: 0.6px;
}
.logo {
  font-size: 24px;
  font-weight: 900;
  color: #94a3b8;
  letter-spacing: -0.5px;
}
.logo span { color: #ffffff; }
.title-area {
  text-align: center;
  margin-top: 6px;
  min-height: 105px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.headline {
  font-size: 40px;
  font-weight: 900;
  color: #fbbf24;
  line-height: 1.25;
  margin-bottom: 6px;
}
.subheadline {
  font-size: 21px;
  font-weight: 600;
  color: #e0e7ff;
  max-width: 950px;
  margin: 0 auto;
  line-height: 1.35;
}
.graphic-area {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
}
.footer {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  color: #64748b;
  font-weight: 600;
  border-top: 1px solid rgba(255,255,255,0.08);
  padding-top: 10px;
}
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <div class="badge">AGILE & SCRUM</div>
    <div class="logo">iTBA <span>Mentor</span></div>
  </div>
  <div class="title-area">
    <div class="headline">Ở MỘT CÔNG TY NỌ</div>
    <div class="subheadline">CÓ NGƯỜI BA MANG CHỮ C TRÊN NGỰC ÁO</div>
  </div>
  <div class="graphic-area">
    
    <svg width="640" height="260" viewBox="0 0 640 260">
      <g transform="translate(40, 30)">
        <rect x="0" y="0" width="170" height="195" rx="14" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
        <circle cx="85" cy="45" r="22" fill="#1e293b"/>
        <text x="85" y="52" text-anchor="middle" fill="#ffffff" font-size="20">🔄</text>
        <text x="85" y="90" text-anchor="middle" fill="#f59e0b" font-size="13" font-weight="bold">1. Sprint Plan</text>
        <rect x="15" y="110" width="140" height="65" rx="6" fill="#1e293b"/>
        <text x="85" y="135" text-anchor="middle" fill="#cbd5e1" font-size="11">Ước lượng độ phức tạp</text>
        <text x="85" y="155" text-anchor="middle" fill="#94a3b8" font-size="10"></text>
      </g>
      <text x="235" y="135" text-anchor="middle" fill="#64748b" font-size="24" font-weight="bold">→</text>
      <g transform="translate(255, 30)">
        <rect x="0" y="0" width="170" height="195" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
        <circle cx="85" cy="45" r="22" fill="#1e293b"/>
        <text x="85" y="52" text-anchor="middle" fill="#ffffff" font-size="20">⚡</text>
        <text x="85" y="90" text-anchor="middle" fill="#38bdf8" font-size="13" font-weight="bold">2. Execution</text>
        <rect x="15" y="110" width="140" height="65" rx="6" fill="#1e293b"/>
        <text x="85" y="135" text-anchor="middle" fill="#cbd5e1" font-size="11">Phản xạ linh hoạt</text>
        <text x="85" y="155" text-anchor="middle" fill="#94a3b8" font-size="10"></text>
      </g>
      <text x="450" y="135" text-anchor="middle" fill="#64748b" font-size="24" font-weight="bold">→</text>
      <g transform="translate(470, 30)">
        <rect x="0" y="0" width="140" height="195" rx="14" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
        <circle cx="70" cy="45" r="22" fill="#1e293b"/>
        <text x="70" y="52" text-anchor="middle" fill="#ffffff" font-size="20">🎯</text>
        <text x="70" y="90" text-anchor="middle" fill="#34d399" font-size="13" font-weight="bold">3. Retro</text>
        <rect x="15" y="110" width="110" height="65" rx="6" fill="#1e293b"/>
        <text x="70" y="135" text-anchor="middle" fill="#a7f3d0" font-size="11">Cải tiến liên tục</text>
        <text x="70" y="155" text-anchor="middle" fill="#6ee7b7" font-size="10"></text>
      </g>
    </svg>
    
  </div>
  <div class="footer">
    <div>Day 44/100 · Sách 100 ngày làm BA</div>
    <div>Nguyễn Bá Phú — ITBA Mentor</div>
  </div>
</div>
</body>
</html>
