<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  width: 1200px;
  height: 675px;
  overflow: hidden;
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: #0f172a;
}
.card {
  width: 1200px;
  height: 675px;
  position: relative;
  background: radial-gradient(circle at 15% 20%, #1e293b 0%, #0f172a 100%);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 34px 48px 24px 48px;
  color: #f8fafc;
}
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.badge {
  background: rgba(56, 189, 248, 0.15);
  border: 1.5px solid #38bdf8;
  color: #38bdf8;
  padding: 6px 16px;
  border-radius: 999px;
  font-weight: 800;
  font-size: 13px;
  letter-spacing: 0.6px;
}
.logo {
  font-size: 24px;
  font-weight: 900;
  color: #94a3b8;
  letter-spacing: -0.5px;
}
.logo span { color: #ffffff; }
.title-area {
  text-align: center;
  margin-top: 6px;
  min-height: 105px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.headline {
  font-size: 34px;
  font-weight: 900;
  color: #38bdf8;
  line-height: 1.25;
  margin-bottom: 6px;
}
.subheadline {
  font-size: 21px;
  font-weight: 600;
  color: #cbd5e1;
  max-width: 950px;
  margin: 0 auto;
  line-height: 1.35;
}
.graphic-area {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
}
.footer {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  color: #64748b;
  font-weight: 600;
  border-top: 1px solid rgba(255,255,255,0.08);
  padding-top: 10px;
}
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <div class="badge">ALGORITHM · DYNAMIC PRICING</div>
    <div class="logo">iTBA <span>Mentor</span></div>
  </div>
  <div class="title-area">
    <div class="headline">Sao hôm qua đi 50k, hôm nay lại 65k?</div>
    <div class="subheadline">Bài toán cân bằng cung cầu và thuật toán định giá Surge</div>
  </div>
  <div class="graphic-area">
    
    <svg width="640" height="260" viewBox="0 0 640 260">
      <!-- Surge Pricing Curve (50k -> 65k) -->
      <g transform="translate(50, 30)">
        <rect x="0" y="0" width="540" height="195" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
        <!-- Chart axes -->
        <line x1="60" y1="155" x2="480" y2="155" stroke="#334155" stroke-width="2"/>
        <line x1="60" y1="30" x2="60" y2="155" stroke="#334155" stroke-width="2"/>
        <text x="40" y="158" fill="#94a3b8" font-size="11">50k</text>
        <text x="40" y="65" fill="#f59e0b" font-size="11" font-weight="bold">65k</text>
        <!-- Baseline price line -->
        <line x1="60" y1="130" x2="240" y2="130" stroke="#10b981" stroke-width="3"/>
        <circle cx="150" cy="130" r="8" fill="#10b981"/>
        <text x="150" y="115" text-anchor="middle" fill="#34d399" font-size="12" font-weight="bold">Bình thường: 50K</text>
        
        <!-- Surge Curve -->
        <path d="M 240,130 C 290,130 310,60 380,60 L 480,60" fill="none" stroke="#f59e0b" stroke-width="4"/>
        <circle cx="380" cy="60" r="9" fill="#ef4444"/>
        <text x="380" y="42" text-anchor="middle" fill="#f87171" font-size="13" font-weight="bold">Mưa lớn + Giờ cao điểm: 65K</text>
        
        <!-- Multiplier factors -->
        <text x="120" y="180" fill="#94a3b8" font-size="11">Base Supply = Demand</text>
        <text x="350" y="180" fill="#fbbf24" font-size="11" font-weight="bold">Surge Multiplier x1.3 (Nhu cầu tăng 300%)</text>
      </g>
    </svg>
    
  </div>
  <div class="footer">
    <div>Day 61/100 · Sách 100 ngày làm BA</div>
    <div>Nguyễn Bá Phú — ITBA Mentor</div>
  </div>
</div>
</body>
</html>
