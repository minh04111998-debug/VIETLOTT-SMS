<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face {
  font-family: 'MontserratLocal';
  src: local('Montserrat Bold'), url('file:///C:/Windows/Fonts/Montserrat-Bold.ttf') format('truetype');
  font-weight: 800;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  width: 1200px;
  height: 675px;
  overflow: hidden;
  background: #FAEFD3;
  font-family: 'MontserratLocal', 'Montserrat', 'Segoe UI', sans-serif;
}
.card {
  width: 1200px;
  height: 675px;
  position: relative;
  background: radial-gradient(circle at 50% 45%, #FBF2DA 0%, #FAEFD3 70%, #F8EBD0 100%);
}
/* Subtle warm paper grain overlay */
.card::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image: radial-gradient(rgba(139, 105, 60, 0.045) 1px, transparent 0);
  background-size: 18px 18px;
  pointer-events: none;
}
.layout-top {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  padding: 46px 64px 0 64px;
}
.headline-top {
  text-align: center;
  color: #054AA3;
  font-size: 36px;
  font-weight: 800;
  -webkit-text-stroke: 0.55px #054AA3;
  line-height: 1.32;
  letter-spacing: -0.2px;
  z-index: 2;
}
.scene-bottom {
  flex: 1;
  width: 100%;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  overflow: hidden;
  z-index: 1;
}
.scene-bottom svg {
  max-width: 900px;
  max-height: 468px;
  width: auto;
  height: auto;
  display: block;
}
.layout-split {
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: space-between;
  padding: 32px 68px 0 68px;
  gap: 24px;
}
.headline-side {
  flex: 0 0 510px;
  color: #054AA3;
  font-size: 36px;
  font-weight: 800;
  -webkit-text-stroke: 0.55px #054AA3;
  line-height: 1.36;
  padding-bottom: 36px;
  z-index: 2;
}
.headline-side.left { text-align: left; }
.headline-side.right { text-align: left; }
.scene-side {
  flex: 1;
  height: 100%;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  z-index: 1;
}
.scene-side svg {
  max-width: 560px;
  max-height: 545px;
  width: auto;
  height: auto;
  display: block;
}
</style>
</head>
